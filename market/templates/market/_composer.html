{% load static %}<form method="post" enctype="multipart/form-data" class="chat-composer wa-composer" data-chat-form>{% csrf_token %}<input type="hidden" name="reply_to"><div class="wa-reply-bar" data-reply-bar hidden><div><strong></strong><span></span></div><button type="button" aria-label="{% tr '取消引用' 'Cancel quote' %}">×</button></div><div class="wa-photo-bar" data-photo-bar hidden><img alt=""><button type="button" aria-label="{% tr '移除圖片' 'Remove photo' %}">×</button></div><div class="wa-composer-row"><label class="wa-attach" aria-label="{% tr '傳送圖片' 'Send a photo' %}"><img class="ui-icon" src="{% static 'market/ui/icons/plus.svg' %}" alt="" width="22" height="22"><input type="file" name="image" accept="image/jpeg,image/png,image/webp"></label><textarea name="text" rows="1" maxlength="2000" placeholder="{% tr '輸入訊息…' 'Write a message…' %}" aria-label="{% tr '訊息' 'Message' %}"></textarea><button class="button" data-send {% if group_form %}name="action" value="send"{% endif %} aria-label="{% tr '發送訊息' 'Send message' %}"><img class="ui-icon" src="{% static 'market/ui/icons/send.svg' %}" alt="" width="20" height="20"></button></div></form>
