{% extends 'market/base.html' %}{% block content %}<section class="page narrow"><h1>{{ t.report }} · {{ kind }} #{{ target }}</h1><form method="post" class="panel form-stack">{% csrf_token %}<p><label for="reason">{% tr '請說明原因（5–2000 字）' 'Describe the issue (5–2000 characters)' %}</label><textarea id="reason" name="reason" rows="6" minlength="5" maxlength="2000" required></textarea></p><p class="hint">{% tr '舉報僅供管理團隊查看。請勿包含不必要的敏感個人資料。' 'Reports are visible to the moderation team. Avoid unnecessary sensitive personal information.' %}</p><button class="button">{% tr '提交舉報' 'Submit report' %}</button></form></section>{% endblock %}
