<details class="lang-menu"><summary class="lang" aria-label="Language / 語言 / 语言">{% if lang == 'en' %}EN{% elif lang == 'hans' %}简{% else %}繁{% endif %} ▾</summary><form method="post" action="/language/" id="lang-form">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">{% for code,label in languages %}<button name="lang" value="{{ code }}" {% if code == lang %}aria-current="true"{% endif %}>{{ label }}</button>{% endfor %}</form></details>
